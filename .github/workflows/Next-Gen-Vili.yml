name: Build Vili HyperOS Next-Gen Kernel

on:
  workflow_dispatch: # Allows manual trigger from the GitHub Actions UI

jobs:
  build:
    runs-on: ubuntu-24.04 # Modern environment for fast and reliable compilation
    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v4

    - name: Install Compiling Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache flex g++-multilib gcc-multilib git gnupg gperf lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev libsdl1.1-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev libelf-dev llvm lld

    - name: Download Google AOSP Clang Toolchain (r522817 / Clang 18-19)
      run: |
        mkdir -p clang
        cd clang
        # Fetches official Google AOSP compiler binaries designed for modern OS cross-compatibility (Android 14-17 / HyperOS 2.0-4.0)
        wget https://googlesource.com
        tar -xzf clang-r522817.tar.gz
        echo "$(pwd)/bin" >> $GITHUB_PATH

    - name: Force HyperOS 2.0-4.0 & Android 14-17 Defconfig Injections
      run: |
        # Automatically ensures mandatory system compatibility flags are injected before compiling
        DEFCONFIG_PATH="arch/arm64/configs/vili_defconfig"
        if [ ! -f "$DEFCONFIG_PATH" ]; then
          # Fallback check if the file is housed inside a vendor directory
          DEFCONFIG_PATH="arch/arm64/configs/vendor/vili_defconfig"
        fi
        
        echo "Injecting configuration layers into $DEFCONFIG_PATH..."
        echo "" >> $DEFCONFIG_PATH
        echo "# Universal HyperOS Compatibility Layers" >> $DEFCONFIG_PATH
        echo "CONFIG_MIUI_KERNEL=y" >> $DEFCONFIG_PATH
        echo "CONFIG_XIAOMI_HARDWARE=y" >> $DEFCONFIG_PATH
        echo "CONFIG_MACH_XIAOMI_VILI=y" >> $DEFCONFIG_PATH
        echo "CONFIG_ANDROID_BINDERFS=y" >> $DEFCONFIG_PATH
        echo "CONFIG_EROFS_FS=y" >> $DEFCONFIG_PATH
        echo "CONFIG_EROFS_FS_ZIP=y" >> $DEFCONFIG_PATH
        echo "CONFIG_EROFS_FS_XATTR=y" >> $DEFCONFIG_PATH
        echo "CONFIG_EROFS_FS_POSIX_ACL=y" >> $DEFCONFIG_PATH
        echo "CONFIG_BUILD_ARM64_APPENDED_DTB_IMAGE=y" >> $DEFCONFIG_PATH
        
        # Injects the Kernel Name directly into the config profile configuration
        echo 'CONFIG_LOCALVERSION="-Next-Gen"' >> $DEFCONFIG_PATH

    - name: Compile HyperOS Universal Kernel
      run: |
        export ARCH=arm64
        export SUBARCH=arm64
        
        # Explicit full-stack LLVM bindings required to support strict 16KB/64KB Android architectures
        export CC=clang
        export LD=ld.lld
        export AR=llvm-ar
        export NM=llvm-nm
        export OBJCOPY=llvm-objcopy
        export OBJDUMP=llvm-objdump
        export STRIP=llvm-strip
        
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
        
        # Select active defconfig file name base
        CONF_FILE="vili_defconfig"
        if [ ! -f "arch/arm64/configs/vili_defconfig" ]; then
          CONF_FILE="vendor/vili_defconfig"
        fi
        
        make O=out clean
        make O=out mrproper
        make O=out $CONF_FILE
        
        # Build using all virtual CPU threads with strict LLVM assembly rules and custom name flags
        make -j$(nproc --all) O=out LOCALVERSION=-Next-Gen LLVM=1 LLVM_IAS=1

    - name: Package and Verify Kernel Binary
      run: |
        # Prioritizes Appended DTB Image layers to ensure the hardware tree is compiled directly into the boot sector
        if [ -f out/arch/arm64/boot/Image.gz-dtb ]; then
          cp out/arch/arm64/boot/Image.gz-dtb ./Image
          echo "Build status: Appended DTB Image.gz generated successfully."
        elif [ -f out/arch/arm64/boot/Image.gz ]; then
          cp out/arch/arm64/boot/Image.gz ./Image
          echo "Build status: Standard Compressed Image.gz generated."
        elif [ -f out/arch/arm64/boot/Image ]; then
          cp out/arch/arm64/boot/Image ./Image
          echo "Build status: Raw standard Image compiled successfully."
        else
          echo "CRITICAL FAULT: Kernel compilation output path is missing!"
          exit 1
        fi

    - name: Upload Universal Image to GitHub Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Next-Gen-Vili-Kernel
        path: ./Image
        
