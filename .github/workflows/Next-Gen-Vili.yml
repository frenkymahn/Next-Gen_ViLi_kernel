name: Build vili hyperos Next-Gen kernel

on:
  workflow_dispatch: # Allows manual trigger from the GitHub Actions UI

jobs:
  build:
    runs-on: ubuntu-24.04 # Modern fast build runner environment
    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v4

    - name: Install System Compiling Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache flex g++-multilib gcc-multilib git gnupg gperf lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev libelf-dev llvm lld clang
        
        # Ubuntu 24.04 compatibility layers for legacy prebuilt toolchains
        sudo ln -sf /lib/x86_64-linux-gnu/libtinfo.so.6 /lib/x86_64-linux-gnu/libtinfo.so.5
        sudo ln -sf /lib/x86_64-linux-gnu/libncurses.so.6 /lib/x86_64-linux-gnu/libncurses.so.5

    - name: Automatically Fix Touchscreen Makefile Syntax Error
      run: |
        MAKEFILE_PATH="drivers/input/touchscreen/focaltech_3680/Makefile"
        if [ -f "$MAKEFILE_PATH" ]; then
          echo "Fixing missing separator syntax error in focaltech Makefile..."
          sed -i 's/^[[:space:]]\+/	/' "$MAKEFILE_PATH"
        else
          echo "Focaltech Makefile path not found, skipping patch."
        fi

    - name: Force HyperOS 2.0-4.0 & Android 14-17 Defconfig Injections
      run: |
        DEFCONFIG_PATH="arch/arm64/configs/vili_defconfig"
        if [ ! -f "$DEFCONFIG_PATH" ]; then
          DEFCONFIG_PATH="arch/arm64/configs/vendor/vili_defconfig"
        fi
        
        echo "Injecting configuration layers into $DEFCONFIG_PATH..."
        echo "" >> $DEFCONFIG_PATH
        echo "# Universal HyperOS Compatibility Layers" >> $DEFCONFIG_PATH
        echo "CONFIG_MIUI_KERNEL=y" >> $DEFCONFIG_PATH
        echo "CONFIG_XIAOMI_HARDWARE=y" >> $DEFCONFIG_PATH
        echo "CONFIG_MACH_XIAOMI_VILI=y" >> $DEFCONFIG_PATH
        echo "CONFIG_ANDROID_BINDERFS=y" >> $DEFCONFIG_PATH
        echo "CONFIG_EROFS_FS=y" >> $DEFCONFIG_PATH
        echo "CONFIG_EROFS_FS_ZIP=y" >> $DEFCONFIG_PATH
        echo "CONFIG_EROFS_FS_XATTR=y" >> $DEFCONFIG_PATH
        echo "CONFIG_EROFS_FS_POSIX_ACL=y" >> $DEFCONFIG_PATH
        echo "CONFIG_BUILD_ARM64_APPENDED_DTB_IMAGE=y" >> $DEFCONFIG_PATH
        
        # Hardcodes the Next-Gen local version string directly into configuration profile
        echo 'CONFIG_LOCALVERSION="-Next-Gen"' >> $DEFCONFIG_PATH

    - name: Compile HyperOS Universal Kernel
      run: |
        export ARCH=arm64
        export SUBARCH=arm64
        
        # DYNAMIC FIX: Use current working directory to accurately point to embedded compilers
        ROOT_DIR=$(pwd)
        CLANG_DIR="$ROOT_DIR/android/prebuilts/clang/host/linux-x86/clang-r41d"
        GCC64_DIR="$ROOT_DIR/android/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9"
        GCC32_DIR="$ROOT_DIR/android/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9"
        
        # Export toolchains into system PATH before running compilation parameters
        export PATH="$CLANG_DIR/bin:$GCC64_DIR/bin:$GCC32_DIR/bin:$PATH"
        
        # Define internal compilation targets
        export CC=clang
        export LD=ld.lld
        export AR=llvm-ar
        export NM=llvm-nm
        export OBJCOPY=llvm-objcopy
        export OBJDUMP=llvm-objdump
        export STRIP=llvm-strip
        
        export CROSS_COMPILE=aarch64-linux-android-
        export CROSS_COMPILE_ARM32=arm-linux-androideabi-
        
        CONF_FILE="vili_defconfig"
        if [ ! -f "arch/arm64/configs/vili_defconfig" ]; then
          CONF_FILE="vendor/vili_defconfig"
        fi
        
        make O=out clean
        make O=out mrproper
        make O=out $CONF_FILE
        
        # Compiles using strict LLVM wrappers bound to Next-Gen local name
        make -j$(nproc --all) O=out LOCALVERSION=-Next-Gen LLVM=1 LLVM_IAS=1

    - name: Package and Verify Kernel Binary Outputs
      run: |
        mkdir -p out_artifacts
        
        # 1. Package the core kernel image
        if [ -f out/arch/arm64/boot/Image.gz-dtb ]; then
          cp out/arch/arm64/boot/Image.gz-dtb ./out_artifacts/Image
          echo "Core Image.gz-dtb captured."
        elif [ -f out/arch/arm64/boot/Image ]; then
          cp out/arch/arm64/boot/Image ./out_artifacts/Image
          echo "Core Image captured."
        fi
        
        # 2. Package DTBO Image if compiled by your source
        if [ -f out/arch/arm64/boot/dtbo.img ]; then
          cp out/arch/arm64/boot/dtbo.img ./out_artifacts/dtbo.img
          echo "DTBO Image captured."
        elif [ -f out/arch/boot/dtbo.img ]; then
          cp out/arch/boot/dtbo.img ./out_artifacts/dtbo.img
          echo "DTBO Image captured from backup path."
        fi

        # 3. Package Vendor Boot Image if compiled by your source
        if [ -f out/arch/arm64/boot/vendor_boot.img ]; then
          cp out/arch/arm64/boot/vendor_boot.img ./out_artifacts/vendor_boot.img
          echo "Vendor Boot Image captured."
        fi

        # Final verification step
        if [ ! -f ./out_artifacts/Image ]; then
          echo "CRITICAL FAULT: Kernel compilation output path is missing!"
          exit 1
        fi

    - name: Upload Universal Image to GitHub Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Next-Gen-Vili-Kernel-Pack
        path: ./out_artifacts/
        
