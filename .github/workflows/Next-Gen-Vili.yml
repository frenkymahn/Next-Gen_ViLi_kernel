name: Build vili hyperos Next-Gen kernel

on:
  workflow_dispatch: # Allows manual trigger from the GitHub Actions UI

jobs:
  build:
    runs-on: ubuntu-24.04 # Modern fast build runner environment
    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v4

    - name: Install System Compiling Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache flex g++-multilib gcc-multilib git gnupg gperf lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev libelf-dev llvm lld clang
        
        # Ubuntu 24.04 compatibility layers for legacy prebuilt toolchains
        sudo ln -sf /lib/x86_64-linux-gnu/libtinfo.so.6 /lib/x86_64-linux-gnu/libtinfo.so.5
        sudo ln -sf /lib/x86_64-linux-gnu/libncurses.so.6 /lib/x86_64-linux-gnu/libncurses.so.5

    - name: Automatically Fix Touchscreen Makefile Syntax Error
      run: |
        MAKEFILE_PATH="drivers/input/touchscreen/focaltech_3680/Makefile"
        if [ -f "$MAKEFILE_PATH" ]; then
          echo "Fixing missing separator syntax error in focaltech Makefile..."
          sed -i 's/^[[:space:]]\+/	/' "$MAKEFILE_PATH"
        else
          echo "Focaltech Makefile path not found, skipping patch."
        fi

    - name: Automatically Patch CNSS2 Wireless Driver with Linker Stubs
      run: |
        BUS_C_PATH="drivers/net/wireless/cnss2/bus.c"
        if [ -f "$BUS_C_PATH" ]; then
          echo "Injecting weak linker stub definitions into bus.c to eliminate undefined/duplicate conflicts..."
          
          echo "#ifndef _BUS_STUBS_H" > bus_stubs.h
          echo "#define _BUS_STUBS_H" >> bus_stubs.h
          echo "#include <linux/types.h>" >> bus_stubs.h
          echo "#include <linux/compiler.h>" >> bus_stubs.h
          echo "struct device;" >> bus_stubs.h
          echo "struct cnss_platform_cap;" >> bus_stubs.h
          echo "__attribute__((weak)) int cnss_get_dev_bus_type(struct device *dev) { return 0; }" >> bus_stubs.h
          echo "__attribute__((weak)) int cnss_get_platform_cap(struct device *dev, struct cnss_platform_cap *cap) { return 0; }" >> bus_stubs.h
          echo "__attribute__((weak)) void cnss_request_pm_qos(struct device *dev, u32 qos_val) { return; }" >> bus_stubs.h
          echo "#endif" >> bus_stubs.h
          
          sed -i '1s/^/#include "bus_stubs.h"\n/' "$BUS_C_PATH"
          mv bus_stubs.h drivers/net/wireless/cnss2/
        else
          echo "Wireless driver path not found, skipping patch."
        fi

    - name: Force HyperOS 2.0-4.0 & Android 14-17 Defconfig Injections
      run: |
        DEFCONFIG_PATH="arch/arm64/configs/vili_defconfig"
        if [ ! -f "$DEFCONFIG_PATH" ]; then
          DEFCONFIG_PATH="arch/arm64/configs/vendor/vili_defconfig"
        fi
        
        echo "Injecting configuration layers into $DEFCONFIG_PATH..."
        echo "" >> $DEFCONFIG_PATH
        echo "# Universal HyperOS Compatibility Layers" >> $DEFCONFIG_PATH
        echo "CONFIG_MIUI_KERNEL=y" >> $DEFCONFIG_PATH
        echo "CONFIG_XIAOMI_HARDWARE=y" >> $DEFCONFIG_PATH
        echo "CONFIG_MACH_XIAOMI_VILI=y" >> $DEFCONFIG_PATH
        echo "CONFIG_ANDROID_BINDERFS=y" >> $DEFCONFIG_PATH
        echo "CONFIG_EROFS_FS=y" >> $DEFCONFIG_PATH
        echo "CONFIG_EROFS_FS_ZIP=y" >> $DEFCONFIG_PATH
        echo "CONFIG_EROFS_FS_XATTR=y" >> $DEFCONFIG_PATH
        echo "CONFIG_EROFS_FS_POSIX_ACL=y" >> $DEFCONFIG_PATH
        echo "CONFIG_BUILD_ARM64_APPENDED_DTB_IMAGE=y" >> $DEFCONFIG_PATH
        
        # Hardcodes the Next-Gen local version string directly into configuration profile
        echo 'CONFIG_LOCALVERSION="-Next-Gen"' >> $DEFCONFIG_PATH

    - name: Compile HyperOS Universal Kernel
      run: |
        export ARCH=arm64
        export SUBARCH=arm64
        
        ROOT_DIR=$(pwd)
        CLANG_DIR="$ROOT_DIR/android/prebuilts/clang/host/linux-x86/clang-r41d"
        GCC64_DIR="$ROOT_DIR/android/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9"
        GCC32_DIR="$ROOT_DIR/android/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9"
        
        # Create absolute host symlinks so the configuration checks resolve safely
        sudo ln -sf "$CLANG_DIR/bin/clang" /usr/bin/aarch64-linux-android-gcc
        sudo ln -sf "$CLANG_DIR/bin/clang" /usr/bin/arm-linux-androideabi-gcc
        
        # Prepend all embedded toolchain folders explicitly into the system PATH
        export PATH="$CLANG_DIR/bin:$GCC64_DIR/bin:$GCC32_DIR/bin:$PATH"
        
        # Consolidate build arguments cleanly
        MAKE_ARGS="ARCH=arm64 \
                   SUBARCH=arm64 \
                   CC=clang \
                   LD=ld.lld \
                   AR=llvm-ar \
                   NM=llvm-nm \
                   OBJCOPY=llvm-objcopy \
                   OBJDUMP=llvm-objdump \
                   STRIP=llvm-strip \
                   CROSS_COMPILE=aarch64-linux-android- \
                   CROSS_COMPILE_ARM32=arm-linux-androideabi- \
                   LLVM=1 \
                   LLVM_IAS=1"
        
        CONF_FILE="vili_defconfig"
        if [ ! -f "arch/arm64/configs/vili_defconfig" ]; then
          CONF_FILE="vendor/vili_defconfig"
        fi
        
        # Clean build output structure safely
        make O=out $MAKE_ARGS clean
        make O=out $MAKE_ARGS mrproper
        
        # Initialize configuration file using our symlinked variables
        make O=out $MAKE_ARGS $CONF_FILE
        
        # Compile using all available host virtual cores cleanly
        make -j$(nproc --all) O=out LOCALVERSION=-Next-Gen $MAKE_ARGS

    - name: Automatically Assemble AnyKernel3 Flashable Distribution Package
      run: |
        # Clean workspace target directory
        rm -rf $RUNNER_TEMP/anykernel
        mkdir -p $RUNNER_TEMP/anykernel
        cd $RUNNER_TEMP/anykernel
        
        # FIXED: Download AnyKernel3 zip master package directly using curl instead of git clone 
        # This completely avoids the submodule git configuration conflict error
        curl -L https://github.com/osm0sis/AnyKernel3/archive/refs/heads/master.zip -o AK3.zip
        unzip AK3.zip
        mv AnyKernel3-master/* .
        rm -rf AK3.zip AnyKernel3-master
        
        # Configure installation block properties matching Xiaomi 11T Pro specs
        sed -i 's/kernel.string=.*/kernel.string=Next-Gen Universal HyperOS Kernel for Xiaomi 11T Pro (vili)/' anykernel.sh
        sed -i 's/device.name1=.*/device.name1=vili/' anykernel.sh
        
        # Exact absolute partition path routing configuration required for Virtual A/B storage
        sed -i 's|block=.*|block=/dev/block/bootdevice/by-name/boot;|' anykernel.sh
        sed -i 's/is_slot_device=.*/is_slot_device=auto;/' anykernel.sh
        
        # Core configuration for raw, uncompressed 45MB Image files
        sed -i 's/split_boot=.*/split_boot=0;/' anykernel.sh
        
        # Copy the compiled binary image explicitly to the exact root location of the isolated zip tree framework
        if [ -f $GITHUB_WORKSPACE/out/arch/arm64/boot/Image ]; then
          cp $GITHUB_WORKSPACE/out/arch/arm64/boot/Image ./Image
          echo "SUCCESS: Raw Image binary packed into destination root."
        elif [ -f $GITHUB_WORKSPACE/out/arch/arm64/boot/Image.gz-dtb ]; then
          cp $GITHUB_WORKSPACE/out/arch/arm64/boot/Image.gz-dtb ./Image
          echo "SUCCESS: Renamed compressed image target to flat Image."
        else
          echo "ERROR: Missing compiled Image binary!" && exit 1
        fi
        
        # Compress the staging structures into the final update zip package
        zip -r9 $GITHUB_WORKSPACE/Next-Gen-Vili-HyperOS-Flashable.zip * -x README.md

    - name: Upload Flashable ZIP to GitHub Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Next-Gen-Vili-HyperOS-Flashable-Zip
        path: ./Next-Gen-Vili-HyperOS-Flashable.zip
        
