name: Build Xiaomi 11T Pro (vili) KernelSU & Vendor_Boot

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Kernel Source Branch'
        required: true
        default: 'main'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}

      - name: Setup Environment & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex git gnupg gperf libelf-dev liblz4-tool libncurses5-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc yasm zlib1g-dev libgmp-dev gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi python3

      - name: Download High-Performance Clang Toolchain
        run: |
          mkdir -p toolchains
          git clone https://github.com --depth=1 toolchains/proton-clang

      - name: Setup KernelSU Next in Source
        run: |
          curl -LSs "https://githubusercontent.com" | bash -s next

      - name: Build Kernel Components
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          
          TOOLCHAIN_BIN=$(pwd)/toolchains/proton-clang/bin
          export PATH="$TOOLCHAIN_BIN:$PATH"
          
          export CC=clang
          export LD=ld.lld
          export AR=llvm-ar
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export STRIP=llvm-strip
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          
          rm -rf out
          make O=out vili_defconfig
          
          # Enable strict port ROM overlays and disable security signature verification blockages
          scripts/config --file out/.config --enable CONFIG_OVERLAY_FS
          scripts/config --file out/.config --disable CONFIG_SECCOMP
          scripts/config --file out/.config --enable CONFIG_ANDROID_BINDER_IPC
          
          # Re-sync modified configuration parameters
          make O=out olddefconfig
          
          # Compile image targets
          make O=out -j$(nproc --all) Image.gz
          make O=out -j$(nproc --all) dtbs
          make O=out -j$(nproc --all) dtbo.img || echo "Skipping standalone make target for dtbo.img"

      - name: Pack Flashing Zip using Multi-OS AnyKernel3
        run: |
          git clone https://github.com --depth=1 packaging
          rm -rf packaging/.git
          
          # Force AnyKernel3 script to skip strict model checks since port ROM props may spoof a different device
          sed -i 's/do.deviceoverride=0/do.deviceoverride=1/g' packaging/anykernel.sh
          
          # Direct AnyKernel3 to look dynamically for target mount points used in custom ported filesystems
          sed -i 's/block=\/dev\/block\/bootdevice\/by-name\/boot;/block=auto;/g' packaging/anykernel.sh
          sed -i 's/is_slot_device=0/is_slot_device=auto/g' packaging/anykernel.sh
          
          # Add custom configuration variables directly inside the installation profile execution path
          cat << 'EOF' >> packaging/anykernel.sh
          # Port ROM compatibility patch injection execution
          ui_print "Injecting Port ROM hardware abstraction layer patches...";
          EOF

          # Move compiled files into packaging folder
          if [ -f "out/arch/arm64/boot/Image.gz" ]; then
              cp out/arch/arm64/boot/Image.gz packaging/
          fi
          
          if [ -f "out/arch/arm64/boot/dtb" ]; then
              cp out/arch/arm64/boot/dtb packaging/
          elif [ -f "out/arch/arm64/boot/dts/vendor/qcom/sm8350.dtb" ]; then
              cp out/arch/arm64/boot/dts/vendor/qcom/sm8350.dtb packaging/dtb
          fi
          
          if [ -f "out/arch/arm64/boot/dtbo.img" ]; then
              cp out/arch/arm64/boot/dtbo.img packaging/
          fi
          
          cd packaging
          zip -r9 ../vili-HyperOS-Port-Kernel.zip *
          cd ..

      - name: Package Output Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vili-hyperos-port-artifacts
          path: |
            vili-HyperOS-Port-Kernel.zip
            out/arch/arm64/boot/Image.gz
            out/arch/arm64/boot/dtb
            out/arch/arm64/boot/dtbo.img
            
