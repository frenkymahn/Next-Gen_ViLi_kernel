name: Build Next-Gen ViLi Kernel (Linux 5.10)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  compile-and-pack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: Setup Essential Host Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential libc6-dev libssl-dev libelf-dev bison flex python3 openjdk-17-jdk wget zip lld llvm git

      - name: Fetch AOSP Clang Toolchain
        run: |
          mkdir -p toolchain/clang
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 toolchain/clang || \
          wget -O clang.tar.gz https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r416183b.tar.gz && tar -xf clang.tar.gz -C toolchain/clang

      - name: Fetch Utilities
        run: |
          mkdir -p tools
          git clone --depth=1 https://github.com/osm0sis/Android-Image-Kitchen tools/AIK
          git clone --depth=1 https://android.googlesource.com/platform/system/tools/mkbootimg tools/mkbootimg

      - name: Clean Output Directory
        run: |
          rm -rf out

      - name: Build Kernel Binary (Linux 5.10)
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          
          CLANG_PATH="$(pwd)/toolchain/clang/bin/"
          export PATH="$CLANG_PATH:$PATH"

          make O=out HOSTCC=gcc HOSTCXX=g++ vili_defconfig || make O=out HOSTCC=gcc HOSTCXX=g++ lahaina_user_defconfig || make O=out HOSTCC=gcc HOSTCXX=g++ lahaina_defconfig
          
          make -j$(nproc) O=out \
            ARCH=arm64 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            STRIP=llvm-strip \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            CONFIG_LOCALVERSION="-Next-Gen-ViLi-v1.0"

      - name: Assemble Final Flashable Partition Images
        run: |
          mkdir -p output
          
          cp out/arch/arm64/boot/Image.gz output/kernel || cp out/arch/arm64/boot/Image output/kernel
          cp out/arch/arm64/boot/dtb output/dtb
          
          python3 tools/mkbootimg/mkdtboimg.py create output/dtbo.img out/arch/arm64/boot/dts/vendor/qcom/*.dtbo

          python3 tools/mkbootimg/mkbootimg.py \
            --kernel output/kernel \
            --dtb output/dtb \
            --os_version 14.0.0 \
            --os_patch_level 2026-03 \
            --header_version 3 \
            --output output/boot.img

          python3 tools/mkbootimg/mkbootimg.py \
            --dtb output/dtb \
            --header_version 3 \
            --vendor_boot output/vendor_boot.img

      - name: Upload Output Kit
        uses: actions/upload-artifact@v4
        with:
          name: ViLi-NextGen-Kit-5.10
          path: |
            output/boot.img
            output/dtbo.img
            output/vendor_boot.img
            
