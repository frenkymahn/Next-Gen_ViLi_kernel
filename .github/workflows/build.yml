name: Build Next-Gen ViLi Port Kernel

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  compile-and-pack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: Setup Essential Host Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential libc6-dev libssl-dev libelf-dev bison flex python3 openjdk-17-jdk wget zip

      - name: Fetch Official AOSP GCC Toolchains (Permanent Fix)
        run: |
          mkdir -p toolchain/gcc64 toolchain/gcc32
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 toolchain/gcc64 || true
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9 toolchain/gcc32 || true
          
          # Fallback to Linaro/Arm GNU Toolchain if needed
          if [ ! -d "toolchain/gcc64/bin" ]; then
            wget -q https://developer.arm.com/-/media/Files/downloads/gnu/13.2.rel1/binrel/arm-gnu-toolchain-13.2.rel1-x86_64-aarch64-none-linux-gnu.tar.xz -O gcc-aarch64.tar.xz
            tar -xf gcc-aarch64.tar.xz --strip-components=1 -C toolchain/gcc64
          fi

      - name: Fetch Android Boot Kitchen Utilities
        run: |
          mkdir -p tools
          git clone --depth=1 https://github.com/osm0sis/Android-Image-Kitchen tools/AIK
          git clone --depth=1 https://android.googlesource.com/platform/system/tools/mkbootimg tools/mkbootimg

      - name: Inject Configuration Targets to defconfig
        run: |
          DEFCONFIG_PATH="arch/arm64/configs/vili_defconfig"
          
          cat << 'EOF' >> "$DEFCONFIG_PATH"
          CONFIG_LOCALVERSION="-Next-Gen-ViLi-v1.0"
          CONFIG_ANDROID_BINDER_IPC=y
          CONFIG_ANDROID_BINDERFS=y
          CONFIG_ANDROID_BINDER_DEVICES="binder,hwbinder,vndbinder"
          CONFIG_BPF_SYSCALL=y
          CONFIG_NET_CLS_ACT=y
          CONFIG_CGROUP_BPF=y
          CONFIG_NAMESPACES=y
          CONFIG_USER_NS=y
          CONFIG_PID_NS=y
          CONFIG_BLK_INLINE_ENCRYPTION=y
          CONFIG_BLK_INLINE_ENCRYPTION_FALLBACK=y
          EOF

      - name: Build Kernel Binary and Device Trees
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          
          # Set Toolchain Paths correctly
          GCC64_BIN="$(pwd)/toolchain/gcc64/bin"
          
          if [ -d "$GCC64_BIN" ]; then
            CROSS_COMPILE_PATH="$GCC64_BIN/aarch64-none-linux-gnu-"
            if [ ! -f "$GCC64_BIN/aarch64-none-linux-gnu-gcc" ]; then
              CROSS_COMPILE_PATH="$GCC64_BIN/aarch64-linux-android-"
            fi
          else
            CROSS_COMPILE_PATH="aarch64-linux-gnu-"
          fi

          make O=out HOSTCC=gcc HOSTCXX=g++ vili_defconfig || make O=out HOSTCC=gcc HOSTCXX=g++ lahaina_user_defconfig || make O=out HOSTCC=gcc HOSTCXX=g++ lahaina_defconfig
          
          make -j4 O=out \
            ARCH=arm64 \
            CROSS_COMPILE="$CROSS_COMPILE_PATH" \
            HOSTCC=gcc \
            HOSTCXX=g++ \
            CONFIG_LOCALVERSION="-Next-Gen-ViLi-v1.0"

      - name: Assemble Final Flashable Partition Images
        run: |
          mkdir -p output
          
          cp out/arch/arm64/boot/Image.gz output/kernel || cp out/arch/arm64/boot/Image output/kernel
          cp out/arch/arm64/boot/dtb output/dtb
          
          python3 tools/mkbootimg/mkdtboimg.py create output/dtbo.img out/arch/arm64/boot/dts/vendor/qcom/*.dtbo

          python3 tools/mkbootimg/mkbootimg.py \
            --kernel output/kernel \
            --dtb output/dtb \
            --os_version 14.0.0 \
            --os_patch_level 2026-03 \
            --header_version 3 \
            --output output/boot.img

          python3 tools/mkbootimg/mkbootimg.py \
            --dtb output/dtb \
            --header_version 3 \
            --vendor_boot output/vendor_boot.img

      - name: Upload Output Kit
        uses: actions/upload-artifact@v4
        with:
          name: ViLi-NextGen-Kit
          path: |
            output/boot.img
            output/dtbo.img
            output/vendor_boot.img
            
