name: Build Next-Gen Lahaina Vili HyperOS Universal Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Custom Next-Gen Repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Clone Official Vili OSS Base & Multi-SDK Sync
        run: |
          git clone https://github.com/Xiaomi-OSS-AOSP-Projects/kernel_xiaomi_vili.git -b android-12-mmi official_vili_kernel || true

      - name: Integrate KernelSU-Next v3.0.0
        run: |
          curl -LSs "https://raw.githubusercontent.com/rifsxd/KernelSU-Next/next/kernel/setup.sh" | bash -s v3.0.0

      - name: Setup Build Environment & Stable Clang Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bc bison build-essential ccache curl flex git gnupg gperf libelf-dev liblz4-tool libssl-dev zlib1g-dev wget xz-utils gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu
          
          mkdir -p toolchain/clang
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git toolchain/clang

      - name: Fix All Kernel Errors Automatically
        run: |
          # Define direct paths for toolchain without adding to global system PATH
          CLANG_PATH="$(pwd)/toolchain/clang/bin"
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          
          rm -rf drivers/input/touchscreen/focaltech_3680 || true
          if [ -f "drivers/input/touchscreen/Kconfig" ]; then
            sed -i '/focaltech_3680/d' drivers/input/touchscreen/Kconfig || true
          fi
          
          if [ -f "kernel/sched/walt/trace.c" ]; then
            sed -i 's|#include <trace.h>|#include "../trace.h"|g' kernel/sched/walt/trace.c || true
          fi
          
          make clean && make mrproper
          
          if [ -f "official_vili_kernel/arch/arm64/configs/vili_defconfig" ]; then
            cp official_vili_kernel/arch/arm64/configs/vili_defconfig arch/arm64/configs/vili_defconfig
          fi
          
          if [ -d "official_vili_kernel/arch/arm64/boot/dts/qcom" ]; then
            rm -rf arch/arm64/boot/dts/qcom/*
            cp -r official_vili_kernel/arch/arm64/boot/dts/qcom/* arch/arm64/boot/dts/qcom/
          fi
          
          make vili_defconfig
          
          scripts/config --set-str CONFIG_LOCALVERSION "-Next-Gen"
          scripts/config --disable CONFIG_WERROR
          
          make olddefconfig
          
          # Build securely by explicitly passing CC and LD paths to prevent host linking errors
          make -j$(nproc) CC=$CLANG_PATH/clang LD=$CLANG_PATH/ld.lld HOSTCC=gcc HOSTCXX=g++ CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu-
          make dtbs CC=$CLANG_PATH/clang LD=$CLANG_PATH/ld.lld HOSTCC=gcc HOSTCXX=g++ CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu-

      - name: Package with AnyKernel3 (Unified Flashable ZIP)
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git anykernel
          rm -rf anykernel/.git
          
          cp arch/arm64/boot/Image.gz anykernel/
          cp arch/arm64/boot/dts/qcom/sm8350.dtb anykernel/dtb || cp arch/arm64/boot/dts/qcom/*.dtb anykernel/dtb || true
          cp arch/arm64/boot/dtbo.img anykernel/ || true
          
          cd anykernel
          
          cat << 'EOF' > anykernel.sh
          properties() {
          kernel.string=Next-Gen Lahaina Universal Kernel
          do.devicecheck=0
          do.modules=0
          do.systemfs=0
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=vili
          device.name2=lahaina
          device.name3=Xiaomi 11T Pro
          }

          block device;
          is_slot_device=1;
          ramdisk_compression=auto;

          . tools/ak3-core.sh

          dump_boot;
          write_boot;

          if [ -f "$home/dtbo.img" ]; then
            flash_block dtbo "$home/dtbo.img";
          fi
          EOF

          zip -r ../Next-Gen-Lahaina-Kernel-$(date +%Y%m%d).zip *

      - name: Upload Final Clean Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Next-Gen-Lahaina-Kernel-Zip
          path: Next-Gen-Lahaina-Kernel-*.zip
          
