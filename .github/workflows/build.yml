name: Build Next-Gen Lahaina Vili HyperOS Universal Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Custom Next-Gen Repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Clone Official Vili OSS Base for Native Drivers, DTB & Lahaina Sync
        run: |
          git clone https://github.com/Xiaomi-OSS-AOSP-Projects/kernel_xiaomi_vili.git -b android-12-mmi official_vili_kernel || true

      - name: Integrate KernelSU-Next v3.0.0
        run: |
          curl -LSs "https://raw.githubusercontent.com/rifsxd/KernelSU-Next/next/kernel/setup.sh" | bash -s v3.0.0

      - name: Setup Build Environment & Toolchain
        run: |
          sudo apt-get update && sudo apt-get upgrade -y
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32z1-dev libelf-dev liblz4-tool libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zlib1g-dev libgmp-dev libmpc-dev libmpfr-dev gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu

      - name: Configure, Merge OSS Lahaina/Vili DTB & Build Kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CC=aarch64-linux-gnu-gcc
          
          make clean && make mrproper
          
          # Merge official vili defconfig and lahaina/qcom device trees
          if [ -f "official_vili_kernel/arch/arm64/configs/vili_defconfig" ]; then
            cp official_vili_kernel/arch/arm64/configs/vili_defconfig arch/arm64/configs/vili_defconfig
          fi
          
          if [ -d "official_vili_kernel/arch/arm64/boot/dts/qcom" ]; then
            rm -rf arch/arm64/boot/dts/qcom/*
            cp -r official_vili_kernel/arch/arm64/boot/dts/qcom/* arch/arm64/boot/dts/qcom/
          fi
          
          make vili_defconfig
          
          # Set About Phone kernel name to Next-Gen
          scripts/config --set-str CONFIG_LOCALVERSION "-Next-Gen"
          
          make olddefconfig
          
          # Build Image.gz, dtbs and dtbo safely using cross compiler
          make -j$(nproc)
          make dtbs

      - name: Package with AnyKernel3 (Lahaina Optimized & Zero-Error Unified ZIP)
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git anykernel
          rm -rf anykernel/.git
          
          # Copy kernel image, matched dtb (lahaina/sm8350) and dtbo
          cp arch/arm64/boot/Image.gz anykernel/
          cp arch/arm64/boot/dts/qcom/sm8350.dtb anykernel/dtb || cp arch/arm64/boot/dts/qcom/*.dtb anykernel/dtb || true
          cp arch/arm64/boot/dtbo.img anykernel/ || true
          
          cd anykernel
          
          cat << 'EOF' > anykernel.sh
          # AnyKernel3 Ramdisk Mod Script for Xiaomi 11T Pro (lahaina / vili)
          properties() {
          kernel.string=Next-Gen Lahaina Kernel for Xiaomi 11T Pro
          do.devicecheck=0
          do.modules=0
          do.systemfs=0
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=vili
          device.name2=lahaina
          device.name3=Xiaomi 11T Pro
          }

          # shell variables
          block device;
          is_slot_device=1;
          ramdisk_compression=auto;

          # import functions
          . tools/ak3-core.sh

          # boot workflow
          dump_boot;

          # write boot
          write_boot;

          # flash dtbo if present
          if [ -f "$home/dtbo.img" ]; then
            flash_block dtbo "$home/dtbo.img";
          fi
          EOF

          # Create final secure flashable zip
          zip -r ../Next-Gen-Lahaina-Vili-Kernel-$(date +%Y%m%d).zip *

      - name: Upload Final Lahaina Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Next-Gen-Lahaina-Vili-Kernel-Zip
          path: Next-Gen-Lahaina-Vili-Kernel-*.zip
          
