name: Build Official Vili HyperOS Kernel (Ubuntu 24.04 Unified)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code Tree
        uses: actions/checkout@v4

      - name: System Dependencies Setup (Ubuntu 24.04 Cleaned)
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache flex g++-multilib gcc-multilib git gnupg gperf lib32z1-dev liblz4-tool libncurses6 libncurses-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev clang lld llvm libcap-dev python3 libelf-dev binutils-aarch64-linux-gnu wget tar
          
          # UBUNTU 24.04 HOTFIX: Map legacy terminal linker layers
          sudo ln -sf /lib/x86_64-linux-gnu/libtinfo.so.6 /lib/x86_64-linux-gnu/libtinfo.so.5
          sudo ln -sf /lib/x86_64-linux-gnu/libncurses.so.6 /lib/x86_64-linux-gnu/libncurses.so.5

      - name: Pull Target Source Components
        run: |
          # FIXED: Use explicit branch flag '-b vili-r-oss' to bypass 'main' checkout failure
          git clone --depth=1 https://github.com -b vili-r-oss kernel-source
          
          # FIXED: Download and extract toolchain in a single workspace layer
          mkdir -p clang
          cd clang
          wget -q https://gitlab.com
          tar -xf clang-r416183b.tar.gz && rm -f clang-r416183b.tar.gz
          cd ..
          
          git clone --depth=1 https://github.com AnyKernel3

      - name: Inject Defconfig Custom Tuning (Bypass Logo Freeze & vDSO Error)
        run: |
          cd kernel-source/arch/arm64/configs/
          
          # Appending critical HyperOS compatibility and bootloop fixes
          echo "CONFIG_BOARD_USES_VENDOR_BOOT=y" >> vili_defconfig
          echo "CONFIG_BUILD_ARM64_APPENDED_DTB_IMAGE=n" >> vili_defconfig
          
          # FIXED: Disable broken vDSO block causing 'x24 register' error
          echo "CONFIG_VDSO=n" >> vili_defconfig
          echo "CONFIG_COMPAT_VDSO=n" >> vili_defconfig
          
          # Pass Android 16/17 network security requirements
          echo "CONFIG_BPF=y" >> vili_defconfig
          echo "CONFIG_BPF_SYSCALL=y" >> vili_defconfig
          echo "CONFIG_CGROUP_BPF=y" >> vili_defconfig
          echo "CONFIG_NET_ACT_BPF=y" >> vili_defconfig
          
          # Allow permissive boot for ported ROMs
          echo "CONFIG_ALWAYS_PERMISSIVE=y" >> vili_defconfig
          echo "CONFIG_DM_VERITY=n" >> vili_defconfig

      - name: Patch Stack Pointer for Clang Compatibility
        run: |
          cd kernel-source/arch/arm64/include/asm
          # Rewrites stack_pointer.h to fix the 'sp' unsuitable register error
          cat << 'EOF' > stack_pointer.h
          #ifndef __ASM_STACK_POINTER_H
          #define __ASM_STACK_POINTER_H
          static inline unsigned long __current_stack_pointer(void) {
              unsigned long sp;
              __asm__ ("mov %0, sp" : "=r" (sp));
              return sp;
          }
          #define current_stack_pointer (__current_stack_pointer())
          #endif
          EOF

      - name: Execute Main Source Build Process
        run: |
          cd kernel-source
          export PATH="$(pwd)/../clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          
          # Initialize the build using the 'out' directory
          make O=out vili_defconfig
          
          # Suppress warning-errors to ensure completion
          make -j$(nproc --all) O=out \
            CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LD=ld.lld \
            KBUILD_CFLAGS="-Wno-error=inline-asm -Wno-error=register -Wno-error=unused-command-line-argument"
          
          make -j$(nproc --all) O=out INSTALL_MOD_PATH=../modules_out modules_install

      - name: Assemble Final Archive Zip File
        run: |
          cp kernel-source/out/arch/arm64/boot/Image AnyKernel3/
          cp kernel-source/out/arch/arm64/boot/dtbo.img AnyKernel3/ || true
          mkdir -p AnyKernel3/vendor_ramdisk/modules
          find modules_out/ -name "*.ko" -exec cp {} AnyKernel3/vendor_ramdisk/modules/ \;
          cd AnyKernel3
          zip -r9 ../Next-Gen-Vili-Fixed.zip * -x .git\* README.md

      - name: Upload Recovery Flashable ZIP Package
        uses: actions/upload-artifact@v4
        with:
          name: HyperOS-Kernel-Vili
          path: Next-Gen-Vili-Fixed.zip
          
