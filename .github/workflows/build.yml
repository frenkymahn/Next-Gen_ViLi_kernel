name: Build Xiaomi 11T Pro (vili) KernelSU & Vendor_Boot

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Kernel Source Branch'
        required: true
        default: 'main'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          branch: ${{ github.event.inputs.branch }}

      - name: Setup KernelSU Next in Source
        run: |
          curl -LSs "https://raw.githubusercontent.com/rifsxd/KernelSU-Next/next/kernel/setup.sh" | bash -s next

      - name: Setup Environment & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex git gnupg gperf imagemagick libelf-dev liblz4-tool libncurses5-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc yasm zlib1g-dev libgmp-dev clang lld llvm gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi python3

      - name: Direct Build Bypassing Header Install Error
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          
          # Load vili defconfig directly
          make O=out vili_defconfig
          
          # Directly build targets without running headers_install sub-make
          make O=out -j4 CC=clang Image.gz
          make O=out -j4 CC=clang dtbs
          make O=out -j4 CC=clang dtbo.img
          make O=out -j4 CC=clang vendor_boot.img || true

      - name: Package Output Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vili-kernelsu-final-artifacts
          path: |
            out/arch/arm64/boot/Image.gz
            out/arch/arm64/boot/dtb
            out/arch/arm64/boot/dtbo.img
            out/arch/arm64/boot/vendor_boot.img
            
