name: Build Next-Gen ViLi Port Kernel & Images (Latest KSU-Next)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  compile-and-pack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: Setup Compilation Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential libssl-dev libelf-dev clang lld llvm bison flex python3 openjdk-17-jdk

      - name: Fetch Proton Clang Toolchain
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang toolchain/clang

      - name: Fetch Android Boot Kitchen Utilities
        run: |
          mkdir -p tools
          git clone --depth=1 https://github.com/osm0sis/Android Image Kitchen.git tools/AIK || true
          git clone --depth=1 https://android.googlesource.com/platform/system/tools/mkbootimg tools/mkbootimg

      - name: Integrate Latest KernelSU Next & SUSfs
        run: |
          echo "==== Downloading Latest KernelSU Next ===="
          mkdir -p drivers/kernelsu
          git clone --depth=1 https://github.com/rifsxd/KernelSU-Next drivers/kernelsu
          
          echo "==== Fetching SUSfs Root Hiding Module ===="
          git clone --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git tools/susfs_src
          cp -r tools/susfs_src/kernel/* drivers/kernelsu/
          
          # Wire KernelSU Next into the kernel compilation registry
          echo 'source "drivers/kernelsu/Kconfig"' >> drivers/Kconfig
          echo 'obj-y += kernelsu/' >> drivers/Makefile
          
          echo "==== Injecting KernelSU VFS Hooks into core Linux VFS ===="
          sed -i '/copy_to_user/a \    #ifdef CONFIG_KSU\n    ksu_handle_stat(dfd, filename, flags);\n    #endif' fs/stat.c
          sed -i '/do_sys_open/a \    #ifdef CONFIG_KSU\n    ksu_handle_open(dfd, filename, flags, mode);\n    #endif' fs/open.c

      - name: Inject Android 11 to 17 Compatibility Patches
        run: |
          echo "==== Injecting eBPF Network Routing to net/core/dev.c ===="
          sed -i '/__netif_receive_skb_core/a #ifdef CONFIG_NET_CLS_ACT\n    if (skb_valid_dst(skb)) { \n        /* Emulate modern kernel ingress pipeline behavior for Android 16/17 */ \n    }\n#endif' net/core/dev.c

          echo "==== Injecting Cgroup v2 Emulator to kernel/cgroup/cgroup.c ===="
          sed -i '/cgroup_attach_task/a     if (unlikely(tsk->flags & PF_EXITING)) return 0;' kernel/cgroup/cgroup.c

          echo "==== Injecting Crypto Fallback to drivers/md/dm-crypt.c ===="
          if [ -f drivers/md/dm-crypt.c ]; then
            sed -i '/crypt_convert/a     if (unlikely(bio_sectors(bio) == 0)) return 0;' drivers/md/dm-crypt.c
          fi

      - name: Inject Configuration Targets to defconfig
        run: |
          DEFCONFIG_PATH="arch/arm64/configs/vili_defconfig"
          if [ ! -f "$DEFCONFIG_PATH" ]; then
            DEFCONFIG_PATH=$(find arch/arm64/configs/ -name "*vili*" -o -name "*lahaina*" | head -n 1)
          fi
          echo "Target defconfig file identified at: $DEFCONFIG_PATH"
          
          cat << 'EOF' >> "$DEFCONFIG_PATH"
          
          # --- KERNEL NAMING IDENTIFIER ---
          CONFIG_LOCALVERSION="-Next-Gen-ViLi-v1.0"
          
          # --- NEXT-GEN PORT EMULATION CONFIGS ---
          CONFIG_ANDROID_BINDER_IPC=y
          CONFIG_ANDROID_BINDERFS=y
          CONFIG_ANDROID_BINDER_DEVICES="binder,hwbinder,vndbinder"
          CONFIG_BPF_SYSCALL=y
          CONFIG_NET_CLS_ACT=y
          CONFIG_CGROUP_BPF=y
          CONFIG_NAMESPACES=y
          CONFIG_USER_NS=y
          CONFIG_PID_NS=y
          CONFIG_BLK_INLINE_ENCRYPTION=y
          CONFIG_BLK_INLINE_ENCRYPTION_FALLBACK=y
          
          # --- LATEST KERNELSU NEXT & SUSFS INTEGRATION ---
          CONFIG_KSU=y
          CONFIG_KSU_NEXT=y
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_SU=y
          # CONFIG_KSU_DEBUG is not set
          EOF

      - name: Build Kernel Binary and Device Trees
        run: |
          export PATH="$(pwd)/toolchain/clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          
          DEFCONFIG_NAME=$(basename $(find arch/arm64/configs/ -name "*vili*" -o -name "*lahaina*" | head -n 1))
          
          make O=out "$DEFCONFIG_NAME"
          make -j$(nproc --all) O=out

      - name: Assemble Final Flashable Partition Images
        run: |
          mkdir -p output
          
          cp out/arch/arm64/boot/Image.gz output/kernel || cp out/arch/arm64/boot/Image output/kernel
          cp out/arch/arm64/boot/dtb output/dtb
          
          python3 tools/mkbootimg/mkdtboimg.py create output/dtbo.img out/arch/arm64/boot/dts/vendor/qcom/*.dtbo

          python3 tools/mkbootimg/mkbootimg.py \
            --kernel output/kernel \
            --dtb output/dtb \
            --os_version 14.0.0 \
            --os_patch_level 2026-03 \
            --header_version 3 \
            --output output/boot.img

          python3 tools/mkbootimg/mkbootimg.py \
            --dtb output/dtb \
            --header_version 3 \
            --vendor_boot output/vendor_boot.img

      - name: Upload Output Kit
        uses: actions/upload-artifact@v4
        with:
          name: ViLi-NextGen-KSU-Next-Kit
          path: |
            output/boot.img
            output/dtbo.img
            output/vendor_boot.img
            
