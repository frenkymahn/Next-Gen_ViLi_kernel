name: Build Next-Gen ViLi Port Kernel & Images

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  compile-and-pack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: Setup Compilation Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential libc6-dev libssl-dev libelf-dev clang lld llvm bison flex python3 openjdk-17-jdk wget zip gcc-multilib g++-multilib

      - name: Fetch Proton Clang Toolchain
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang toolchain/clang

      - name: Fetch Android Boot Kitchen Utilities
        run: |
          mkdir -p tools
          git clone --depth=1 https://github.com/osm0sis/Android-Image-Kitchen tools/AIK
          git clone --depth=1 https://android.googlesource.com/platform/system/tools/mkbootimg tools/mkbootimg

      - name: Setup KernelSU-Next and SUSfs
        run: |
          mkdir -p drivers/kernelsu
          rm -rf drivers/kernelsu/*
          git clone --depth=1 https://github.com/KernelSU-Next/KernelSU-Next.git drivers/kernelsu

          rm -rf tools/susfs_src
          git clone --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git tools/susfs_src
          
          if [ -d "tools/susfs_src/kernel_patches" ]; then
            cp -rf tools/susfs_src/kernel_patches/KernelSU/* drivers/kernelsu/ || true
            cp -rf tools/susfs_src/kernel_patches/fs/* fs/ || true
            cp -rf tools/susfs_src/kernel_patches/include/linux/* include/linux/ || true
          fi

          if [ -f "drivers/kernelsu/Kconfig" ]; then
            if ! grep -q "kernelsu/Kconfig" drivers/Kconfig; then
              echo 'source "drivers/kernelsu/Kconfig"' >> drivers/Kconfig
            fi
          fi
          
          if ! grep -q "kernelsu/" drivers/Makefile; then
            echo 'obj-y += kernelsu/' >> drivers/Makefile
          fi
          
          sed -i '/copy_to_user/a \    #ifdef CONFIG_KSU\n    ksu_handle_stat(dfd, filename, flags);\n    #endif' fs/stat.c || true
          sed -i '/do_sys_open/a \    #ifdef CONFIG_KSU\n    ksu_handle_open(dfd, filename, flags, mode);\n    #endif' fs/open.c || true

      - name: Inject Configuration Targets to defconfig
        run: |
          DEFCONFIG_PATH="arch/arm64/configs/vili_defconfig"
          
          cat << 'EOF' >> "$DEFCONFIG_PATH"
          CONFIG_LOCALVERSION="-Next-Gen-ViLi-v1.0"
          CONFIG_ANDROID_BINDER_IPC=y
          CONFIG_ANDROID_BINDERFS=y
          CONFIG_ANDROID_BINDER_DEVICES="binder,hwbinder,vndbinder"
          CONFIG_BPF_SYSCALL=y
          CONFIG_NET_CLS_ACT=y
          CONFIG_CGROUP_BPF=y
          CONFIG_NAMESPACES=y
          CONFIG_USER_NS=y
          CONFIG_PID_NS=y
          CONFIG_BLK_INLINE_ENCRYPTION=y
          CONFIG_BLK_INLINE_ENCRYPTION_FALLBACK=y
          CONFIG_KSU=y
          CONFIG_KSU_NEXT=y
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_SU=y
          EOF

      - name: Build Kernel Binary and Device Trees
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          
          make O=out vili_defconfig || make O=out lahaina_user_defconfig || make O=out lahaina_defconfig
          
          make -j$(nproc --all) O=out \
            CC=$(pwd)/toolchain/clang/bin/clang \
            LD=$(pwd)/toolchain/clang/bin/ld.lld \
            AR=$(pwd)/toolchain/clang/bin/llvm-ar \
            NM=$(pwd)/toolchain/clang/bin/llvm-nm \
            OBJCOPY=$(pwd)/toolchain/clang/bin/llvm-objcopy \
            OBJDUMP=$(pwd)/toolchain/clang/bin/llvm-objdump \
            STRIP=$(pwd)/toolchain/clang/bin/llvm-strip \
            HOSTCC=$(pwd)/toolchain/clang/bin/clang \
            HOSTCXX=$(pwd)/toolchain/clang/bin/clang++ \
            HOSTLD=$(pwd)/toolchain/clang/bin/ld.lld \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            EXTRA_CFLAGS="-Wno-error"

      - name: Assemble Final Flashable Partition Images
        run: |
          mkdir -p output
          
          cp out/arch/arm64/boot/Image.gz output/kernel || cp out/arch/arm64/boot/Image output/kernel
          cp out/arch/arm64/boot/dtb output/dtb
          
          python3 tools/mkbootimg/mkdtboimg.py create output/dtbo.img out/arch/arm64/boot/dts/vendor/qcom/*.dtbo

          python3 tools/mkbootimg/mkbootimg.py \
            --kernel output/kernel \
            --dtb output/dtb \
            --os_version 14.0.0 \
            --os_patch_level 2026-03 \
            --header_version 3 \
            --output output/boot.img

          python3 tools/mkbootimg/mkbootimg.py \
            --dtb output/dtb \
            --header_version 3 \
            --vendor_boot output/vendor_boot.img

      - name: Upload Output Kit
        uses: actions/upload-artifact@v4
        with:
          name: ViLi-NextGen-KSU-Next-Kit
          path: |
            output/boot.img
            output/dtbo.img
            output/vendor_boot.img
            
