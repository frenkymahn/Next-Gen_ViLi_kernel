name: Build Next-Gen Lahaina Vili HyperOS Universal Kernel (Android 14-17 Pro)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Custom Next-Gen Repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Clone Official Vili OSS Base & Multi-SDK Sync
        run: |
          git clone https://github.com/Xiaomi-OSS-AOSP-Projects/kernel_xiaomi_vili.git -b android-12-mmi official_vili_kernel || true

      - name: Integrate KernelSU-Next v3.0.0
        run: |
          curl -LSs "https://raw.githubusercontent.com/rifsxd/KernelSU-Next/next/kernel/setup.sh" | bash -s v3.0.0

      - name: Setup Build Environment & Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bc bison build-essential ccache curl flex git gnupg gperf libelf-dev liblz4-tool libssl-dev zlib1g-dev gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu

      - name: Fix Source Code, Apply Advanced Android 15-17 & HyperOS Flags
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CC=aarch64-linux-gnu-gcc
          
          # Fix potential makefile syntax errors across source
          find . -name "Makefile" -exec sed -i 's/^[[:space:]]*//' {} + || true
          
          make clean && make mrproper
          
          if [ -f "official_vili_kernel/arch/arm64/configs/vili_defconfig" ]; then
            cp official_vili_kernel/arch/arm64/configs/vili_defconfig arch/arm64/configs/vili_defconfig
          fi
          
          if [ -d "official_vili_kernel/arch/arm64/boot/dts/qcom" ]; then
            rm -rf arch/arm64/boot/dts/qcom/*
            cp -r official_vili_kernel/arch/arm64/boot/dts/qcom/* arch/arm64/boot/dts/qcom/
          fi
          
          make vili_defconfig
          
          # Force set About Phone kernel name to Next-Gen
          scripts/config --set-str CONFIG_LOCALVERSION "-Next-Gen"
          
          # Inject robust flags for Android 15, 16, 17 & HyperOS 1-4 compatibility
          scripts/config --enable CONFIG_KPROBES
          scripts/config --enable CONFIG_HAVE_KPROBES
          scripts/config --enable CONFIG_KPROBE_EVENTS
          scripts/config --enable CONFIG_BPF
          scripts/config --enable CONFIG_BPF_SYSCALL
          scripts/config --enable CONFIG_NET_CLS_BPF
          scripts/config --enable CONFIG_NET_ACT_BPF
          scripts/config --enable CONFIG_BPF_JIT
          scripts/config --enable CONFIG_HAVE_EBPF_JIT
          scripts/config --enable CONFIG_TMPFS_XATTR
          scripts/config --enable CONFIG_TMPFS_POSIX_ACL
          scripts/config --enable CONFIG_ANDROID_BINDER_IPC
          scripts/config --enable CONFIG_ANDROID_BINDERFS
          scripts/config --enable CONFIG_FS_ENCRYPTION
          scripts/config --enable CONFIG_FS_ENCRYPTION_ALGS
          
          make olddefconfig
          
          # Build kernel image and device trees professionally
          make -j$(nproc)
          make dtbs

      - name: Package with AnyKernel3 (Multi-SDK Unified & Zero-Error Flash)
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git anykernel
          rm -rf anykernel/.git
          
          cp arch/arm64/boot/Image.gz anykernel/
          cp arch/arm64/boot/dts/qcom/sm8350.dtb anykernel/dtb || cp arch/arm64/boot/dts/qcom/*.dtb anykernel/dtb || true
          cp arch/arm64/boot/dtbo.img anykernel/ || true
          
          cd anykernel
          
          cat << 'EOF' > anykernel.sh
          properties() {
          kernel.string=Next-Gen Lahaina Universal Kernel (Android 14-17)
          do.devicecheck=0
          do.modules=0
          do.systemfs=0
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=vili
          device.name2=lahaina
          device.name3=Xiaomi 11T Pro
          }

          block device;
          is_slot_device=1;
          ramdisk_compression=auto;

          . tools/ak3-core.sh

          dump_boot;
          write_boot;

          if [ -f "$home/dtbo.img" ]; then
            flash_block dtbo "$home/dtbo.img";
          fi
          EOF

          zip -r ../Next-Gen-Lahaina-Android14-17-Kernel-$(date +%Y%m%d).zip *

      - name: Upload Final Professional Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Next-Gen-Lahaina-Android14-17-Kernel-Zip
          path: Next-Gen-Lahaina-Android14-17-Kernel-*.zip
          
