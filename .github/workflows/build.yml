name: Build Xiaomi 11T Pro Kernel (HyperOS & MIUI Exclusive)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-24.04
    
    steps:
    - name: Checkout Repository Cleanly
      uses: actions/checkout@v4
      with:
        repository: frenkymahn/Next-Gen_ViLi_kernel
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 1
        submodules: recursive

    - name: Setup Build Environment and Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          bc bison build-essential ccache curl flex \
          git gnupg gperf imagemagick \
          libelf-dev liblz4-tool libncurses5-dev libsdl1.2-dev \
          libssl-dev libxml2 libxml2-utils lzop pngcrush rsync \
          schedtool squashfs-tools xsltproc yasm zip zlib1g-dev \
          android-sdk-libsparse-utils gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi binutils-aarch64-linux-gnu \
          python3 python3-pip

    - name: Setup Stable AOSP Clang Toolchain
      run: |
        rm -rf tc
        mkdir -p tc/clang
        # Switching to official stable AOSP Clang to avoid Ubuntu 24.04 glibc loader mismatch errors
        git clone --depth=1 https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 tc/clang || \
        git clone --depth=1 https://github.com/UDP-Team/aosp-clang.git tc/clang
        ls -la tc/clang/bin || ls -la tc/clang/host/linux-x86/clang-r*/bin

    - name: Compile with HyperOS & MIUI Exclusive Configurations
      run: |
        # Automatically locate clang bin path depending on the cloned repo structure
        if [ -d "tc/clang/bin" ]; then
          export PATH="$(pwd)/tc/clang/bin:$PATH"
        else
          export PATH="$(echo $(pwd)/tc/clang/host/linux-x86/clang-r*/bin):$PATH"
        fi

        export ARCH=arm64
        export SUBARCH=arm64
        export KBUILD_BUILD_USER="FrenkyMahn"
        export KBUILD_BUILD_HOST="HyperOS-Server"
        export CLANG_TRIPLE=aarch64-linux-gnu-
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

        mkdir -p out
        
        # Defconfig Detection for vili
        if [ -f "arch/arm64/configs/vili_defconfig" ]; then
          make O=out ARCH=arm64 SUBARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- vili_defconfig
        elif [ -f "arch/arm64/configs/xiaomi_vili_defconfig" ]; then
          make O=out ARCH=arm64 SUBARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- xiaomi_vili_defconfig
        elif [ -f "arch/arm64/configs/kangaroox-vili_defconfig" ]; then
          make O=out ARCH=arm64 SUBARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- kangaroox-vili_defconfig
        else
          make O=out ARCH=arm64 SUBARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- vendor/vili_defconfig
        fi

        # Strict HyperOS / MIUI Exclusive Flags
        {
          echo "CONFIG_WERROR=n"
          echo "CONFIG_BPF=y"
          echo "CONFIG_BPF_SYSCALL=y"
          echo "CONFIG_NET_CLS_ACT=y"
          echo "CONFIG_NET_SCH_INGRESS=y"
          echo "CONFIG_TMPFS_XATTR=y"
          echo "CONFIG_ANDROID_BINDER_IPC=y"
          echo "CONFIG_ANDROID_BINDERFS=y"
          echo "CONFIG_PSI=y"
          echo "CONFIG_MEMCG=y"
          echo "CONFIG_IKCONFIG=y"
          echo "CONFIG_IKCONFIG_PROC=y"
          echo "CONFIG_TUN=y"
          echo "CONFIG_NF_NAT=y"
          echo "CONFIG_NF_CONNTRACK=y"
          echo "CONFIG_LOCALVERSION=\"-HyperOS-Exclusive-FrenkyMahn\""
        } >> out/.config

        make O=out ARCH=arm64 SUBARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig

        make -j$(nproc --all) O=out \
            PYTHON=python3 \
            KCFLAGS="-w" \
            LLVM=1 \
            LLVM_IAS=1 \
            ARCH=arm64 \
            SUBARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            CC=clang \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip

    - name: Prepare HyperOS Exclusive AnyKernel3 Package
      run: |
        mkdir -p kernel_package
        mkdir -p kernel_package/dtb
        cp out/arch/arm64/boot/Image.gz kernel_package/ || true
        cp out/arch/arm64/boot/dtbo.img kernel_package/ || true
        cp out/arch/arm64/boot/dts/qcom/sm8350-v2.1.dtb kernel_package/dtb/ || cp out/arch/arm64/boot/dts/qcom/*.dtb kernel_package/dtb/ || true
        
        if [ -f "out/arch/arm64/boot/boot.img" ]; then
            cp out/arch/arm64/boot/boot.img kernel_package/
        else
            touch kernel_package/boot.img
        fi

        if [ -f "out/arch/arm64/boot/vendor_boot.img" ]; then
            cp out/arch/arm64/boot/vendor_boot.img kernel_package/
        else
            touch kernel_package/vendor_boot.img
        fi

        git clone --depth=1 https://github.com/osm0sis/AnyKernel3 -b master anykernel
        rm -rf anykernel/.git anykernel/README.md
        
        sed -i 's/block device/block device for HyperOS MIUI/g' anykernel/anykernel.sh || true

        cp kernel_package/Image.gz anykernel/ || true
        cp kernel_package/dtbo.img anykernel/ || true
        cp -r kernel_package/dtb anykernel/ || true
        cp kernel_package/boot.img anykernel/ || true
        cp kernel_package/vendor_boot.img anykernel/ || true

        cd anykernel
        zip -r9 ../HyperOS-Exclusive-Vili-Kernel.zip *
        cd ..

        cp -r kernel_package/* out/ || true

    - name: Upload Final Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: HyperOS-Exclusive-Kernel-Package
        path: |
          HyperOS-Exclusive-Vili-Kernel.zip
          out/Image.gz
          out/boot.img
          out/vendor_boot.img
          out/dtb
          out/dtbo.img
          
