name: Build Xiaomi 11T Pro (vili) Kernel & Vendor_Boot

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Kernel Source Branch'
        required: true
        default: 'main'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          branch: ${{ github.event.inputs.branch }}

      - name: Setup KernelSU Next
        run: |
          curl -LSs "https://raw.githubusercontent.com/rifsxd/KernelSU-Next/next/kernel/setup.sh" | bash -s next

      - name: Setup Environment & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex git gnupg gperf imagemagick libelf-dev liblz4-tool libncurses5-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc yasm zlib1g-dev libgmp-dev gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Fix Touchscreen Makefile Separator & Build
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          
          # Fix potential Makefile formatting issue in focaltech driver if exists
          if [ -f "drivers/input/touchscreen/focaltech_3610/Makefile" ]; then
            sed -i 's/ \+/\t/g' drivers/input/touchscreen/focaltech_3610/Makefile
          fi
          
          # Clean source to prevent old object errors
          make clean && make mrproper
          
          # Load vili defconfig for HyperOS / MIUI
          make O=out vili_defconfig
          
          # Compile Kernel steps
          make O=out -j4 Image.gz
          make O=out -j4 dtbs
          make O=out -j4 dtbo.img

      - name: Package Output Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vili-hyperos-kernelsu-artifacts
          path: |
            out/arch/arm64/boot/Image.gz
            out/arch/arm64/boot/dtb
            out/arch/arm64/boot/dtbo.img
            
