name: Build Xiaomi 11T Pro Kernel (Ubuntu 22.04 & HyperOS)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout Repository Cleanly
      uses: actions/checkout@v4
      with:
        repository: frenkymahn/Next-Gen_ViLi_kernel
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 1
        submodules: recursive

    - name: Setup Build Environment and Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          bc bison build-essential ccache curl flex \
          git gnupg gperf imagemagick \
          libelf-dev liblz4-tool libncurses5-dev libsdl1.2-dev \
          libssl-dev libxml2 libxml2-utils lzop pngcrush rsync \
          schedtool squashfs-tools xsltproc yasm zip zlib1g-dev \
          android-sdk-libsparse-utils gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi binutils-aarch64-linux-gnu \
          python3 python3-pip

    - name: Setup Stable Proton Clang Toolchain (Ubuntu 22.04 Native Compatible)
      run: |
        rm -rf tc
        mkdir -p tc/clang
        git clone --depth=1 https://github.com/kdrag0n/proton-clang.git tc/clang
        ls -la tc/clang/bin

    - name: Compile Kernel
      run: |
        export PATH="$(pwd)/tc/clang/bin:$PATH"
        export ARCH=arm64
        export SUBARCH=arm64
        export KBUILD_BUILD_USER="FrenkyMahn"
        export KBUILD_BUILD_HOST="HyperOS-Server"
        export CLANG_TRIPLE=aarch64-linux-gnu-
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

        mkdir -p out
        
        # Using source-defined configurations directly
        make O=out ARCH=arm64 SUBARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- vili_defconfig
        make O=out ARCH=arm64 SUBARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig

        make -j$(nproc --all) O=out \
            PYTHON=python3 \
            KCFLAGS="-w" \
            LLVM=1 \
            LLVM_IAS=1 \
            ARCH=arm64 \
            SUBARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            CC=clang \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip

    - name: Prepare Single Unified AnyKernel3 Package
      run: |
        mkdir -p kernel_package
        mkdir -p kernel_package/dtb
        
        # 1. Kernel Image (Image.gz)
        if [ -f "out/arch/arm64/boot/Image.gz" ]; then
            cp out/arch/arm64/boot/Image.gz kernel_package/
        elif [ -f "out/arch/arm64/boot/Image" ]; then
            gzip -c out/arch/arm64/boot/Image > kernel_package/Image.gz
        fi

        # 2. Device Tree Overlay (dtbo.img)
        if [ -f "out/arch/arm64/boot/dtbo.img" ]; then
            cp out/arch/arm64/boot/dtbo.img kernel_package/
        fi

        # 3. Device Tree Blob (dtb) collection
        if [ -f "out/arch/arm64/boot/dtb" ]; then
            cp out/arch/arm64/boot/dtb kernel_package/
        elif [ -d "out/arch/arm64/boot/dtb" ]; then
            cp -r out/arch/arm64/boot/dtb/* kernel_package/dtb/ || true
        elif [ -f "out/arch/arm64/boot/dts/qcom/sm8350-v2.1.dtb" ]; then
            cp out/arch/arm64/boot/dts/qcom/sm8350-v2.1.dtb kernel_package/dtb/
        fi

        # Setup AnyKernel3 and merge everything into ONE single zip
        git clone --depth=1 https://github.com/osm0sis/AnyKernel3 -b master anykernel
        rm -rf anykernel/.git anykernel/README.md
        
        # Copy everything cleanly inside the AnyKernel3 root folder
        cp kernel_package/Image.gz anykernel/ || true
        [ -f "kernel_package/dtbo.img" ] && cp kernel_package/dtbo.img anykernel/ || true
        [ -d "kernel_package/dtb" ] && [ "$(ls -A kernel_package/dtb)" ] && cp -r kernel_package/dtb anykernel/ || true

        # Create single flashable zip
        cd anykernel
        zip -r9 ../HyperOS-Next-Gen-Vili-Kernel.zip *
        cd ..

    - name: Upload Final Unified Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: HyperOS-Next-Gen-Kernel-Package
        path: |
          HyperOS-Next-Gen-Vili-Kernel.zip
          
