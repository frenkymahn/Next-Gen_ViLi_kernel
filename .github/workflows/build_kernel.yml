name: NEXT-GEN ViLi kernel 

on:
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v4

    - name: Set up Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential curl flex git libssl-dev libncurses5-dev python3 zip unzip tzdata
        sudo apt-get install -y gcc-aarch64-linux-gnu
        sudo apt-get install -y gcc-arm-linux-gnueabi

    - name: Fetch Toolchain (Clang)
      run: |
        mkdir toolchain
        cd toolchain
        # Fetching a modern AOSP Clang toolchain highly compatible with Android 14+
        wget https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/android-14.0.0_r40.tar.gz -O clang-r487747.tar.gz
        tar -xzf clang-r487747.tar.gz
        echo "${PWD}/bin" >> $GITHUB_PATH

    - name: Compile Kernel
      run: |
        export ARCH=arm64
        export SUBARCH=arm64
        export HEADER_ARCH=arm64
        export KBUILD_BUILD_USER=FrenkyMahn
        
        # Define paths for compilation
        export CC=clang
        export CLANG_TRIPLE=aarch64-linux-gnu-
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CROSS_COMPILE_COMPAT=arm-linux-gnueabi-

        # 1. Regenerate config
        make O=out vili_defconfig # Replace with your exact defconfig name

        # 2. Compile Image
        # Add KCFLAGS to skip strict parameter evaluation errors
        make -j$(nproc --all) O=out KCFLAGS="-Wno-error -Wno-implicit-function-declaration"

      

    - name: Package with AnyKernel3
      run: |
        git clone https://github.com/osm0sis/AnyKernel3.git
        cp out/arch/arm64/boot/Image AnyKernel3/
        # If your device uses DTB/DTBO blobs, pull them from out/arch/arm64/boot/dts/
        cp out/arch/arm64/boot/dtb AnyKernel3/ || true 
        
        cd AnyKernel3
        # Adjust anykernel.sh variables inside script to accept any A14-A17 version matching
        sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel.sh
        
        zip -r9 ../HyperOS-Vili-Kernel.zip * -x .git* README.md

    - name: Upload Flashable Kernel Zip
      uses: actions/upload-artifact@v4
      with:
        name: HyperOS-Vili-Kernel
        path: ./HyperOS-Vili-Kernel.zip
        
